function render(){const sc=cs(),b=$('#bd'),now=Date.now();
 $('#scr').className=sc.t=='vid'?'vid':'';
 $('#ttl').textContent=sc.title;
 $('#pi').innerHTML=S.cur?(m.paused?PA:PL):'';
 if(sc.t=='menu'){const it=sc.build(),N=8;
  sc.sel=Math.max(0,Math.min(sc.sel,it.length-1));
  if(sc.sel<sc.top)sc.top=sc.sel;if(sc.sel>=sc.top+N)sc.top=sc.sel-N+1;
  b.innerHTML=it.slice(sc.top,sc.top+N).map((x,i)=>`<div class="r${i+sc.top==sc.sel?' s':''}" data-i="${i+sc.top}"><span class="l">${esc(x.l)}</span>${x.v?`<span class="v">${esc(x.v)}</span>`:''}${x.a?'<i class="ch"></i>':''}</div>`).join('')
   +(it.length>N?`<div class="sb"><i style="top:${sc.top/it.length*208}px;height:${N/it.length*208}px"></i></div>`:'')}
 else if(sc.t=='now'){const f=S.cur;
  b.innerHTML=f?`<div class="np">${artH(f)}<div class="mt"><small>${S.qi+1} sur ${S.q.length}</small><b>${esc(f.title)}</b><span>${esc(f.artist)}</span><span>${esc(f.album||'')}</span></div></div>${bar()}`:'<div class="emp">Aucun morceau en lecture</div>'}
 else if(sc.t=='vid'){b.innerHTML=(m.paused||sk()||S.ov>now||S.vu>now)?bar():''}
 else if(sc.t=='dl'){const d=S.dl;b.innerHTML=`<div class="emp">${d.t?`<b>${esc(d.t)}</b><span>${esc(d.a)}</span>`:''}${d.p?`<div class="tr"><i style="width:${d.p*100}%"></i></div>`:''}<small>${esc(d.m||'')}</small></div>`}
 else if(sc.t=='clock'){const d=new Date();b.innerHTML=`<div class="emp ck"><b>${d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</b><span>${d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</span></div>`}}
setInterval(()=>{if(cs().t=='clock')render()},1000);
</script>
<script>
/* commandes */
function step(d){tick();const sc=cs();
 if(sc.t=='menu'){sc.sel+=d;render()}
 else if(sc.t=='now'||sc.t=='vid'){
  if(sk()){if(isFinite(m.duration))m.currentTime=Math.max(0,Math.min(m.duration,m.currentTime+d*5))}
  else{vol(S.set.vol+d*.05);S.vu=Date.now()+1500;setTimeout(render,1600)}
  ov();render()}}
function ctr(){const sc=cs();
 if(sc.t=='menu'){tick();const x=sc.build()[sc.sel];x&&x.go&&x.go()}
 else if(sc.t=='now'||sc.t=='vid'){tick();S.scrub=!S.scrub;ov();render()}}
function lp(){const sc=cs();let o;
 if(sc.t=='menu'){const x=sc.build()[sc.sel];o=x&&x.opt&&x.opt()}
 else if(sc.t=='now'||sc.t=='vid')o=S.cur&&trkOpts(S.cur);
 if(o){tick();push(o)}}
function back(){tick();if(S.st.length>1){if(cs().t=='vid')m.pause();S.st.pop();S.scrub=false;S.del=false;render();slide(-1)}}
const wh=$('#wh');let g=null;
wh.onpointerdown=e=>{const r=wh.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy;
 g={cx,cy,a:Math.atan2(dy,dx),acc:0,rot:0,d:Math.hypot(dx,dy)/(r.width/2),sx:dx,sy:dy};
 if(g.d<.42)g.t=setTimeout(()=>{if(g){g.lp=1;lp()}},550);
 if(g.d<.42)$('.ct').classList.add('dn');wh.setPointerCapture(e.pointerId)};
wh.onpointermove=e=>{if(!g||g.d<.42)return;const a=Math.atan2(e.clientY-g.cy,e.clientX-g.cx);let d=a-g.a;
 if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;g.a=a;d=d*180/Math.PI;g.acc+=d;g.rot+=Math.abs(d);
 while(Math.abs(g.acc)>=22){const s=Math.sign(g.acc);g.acc-=s*22;step(s)}};
wh.onpointerup=()=>{if(!g)return;const q=g;g=null;clearTimeout(q.t);$('.ct').classList.remove('dn');if(q.lp||q.rot>8)return;if(q.d<.42)return ctr();
 const a=Math.atan2(q.sy,q.sx)*180/Math.PI;
 if(a>-135&&a<-45)back();else if(a>=-45&&a<=45)nx();else if(a>45&&a<135)pp();else pv()};
wh.onpointercancel=()=>{if(g)clearTimeout(g.t);g=null;$('.ct').classList.remove('dn')};
let wa=0;$('#ip').addEventListener('wheel',e=>{e.preventDefault();wa+=e.deltaY;while(Math.abs(wa)>=40){const s=Math.sign(wa);wa-=s*40;step(s)}},{passive:false});
onkeydown=e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
 if(k=='ArrowDown')step(1);else if(k=='ArrowUp')step(-1);else if(k=='Enter')ctr();else if(k=='o')lp();
 else if(k=='Escape'||k=='Backspace')back();else if(k=='ArrowRight')nx();else if(k=='ArrowLeft')pv();else if(k==' ')pp();else return;
 e.preventDefault()};
</script>
<script>
/* Démarrage : mise à l'échelle plein écran, gestes tactiles, initialisation */
function fit(){const iw=innerWidth,ih=innerHeight,s=Math.min(iw/392,ih/620),H=Math.max(620,ih/s);
 $('#w').style.cssText='width:392px;height:'+H+'px;transform:scale('+s+');left:'+(iw-392*s)/2+'px;top:'+(ih-H*s)/2+'px';
 document.documentElement.style.setProperty('--s',s);$('#ip').classList.toggle('fb',iw-392*s<2)}
addEventListener('resize',fit);
$('#bd').onclick=e=>{const r=e.target.closest('.r');if(r&&cs().t=='menu'){cs().sel=+r.dataset.i;ctr()}};
let dv=null;
$('#scr').addEventListener('pointerdown',e=>{if(cs().t=='now'||cs().t=='vid')dv={y:e.clientY,v:S.set.vol}});
addEventListener('pointermove',e=>{if(!dv)return;const s=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--s'))||1;
 vol(dv.v+(dv.y-e.clientY)/(160*s));S.vu=Date.now()+1500;setTimeout(render,1600);render()});
addEventListener('pointerup',()=>{dv=null});addEventListener('pointercancel',()=>{dv=null});
const clk=()=>{$('#hr').textContent=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})};
setInterval(clk,15000);clk();
applyTheme();Bat.init();fit();render();
(async()=>{try{db=await idb();for(const r of await tx('f','readonly',s=>s.getAll())||[])addLib(r);S.pl=await tx('p','readonly',s=>s.getAll())||[];sortLib();resume()}catch(e){}render()})();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
